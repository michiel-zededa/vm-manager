name: CI

on:
  push:
    branches: [ main, "claude/**" ]
    # Doc/asset-only changes don't need a full 3-platform build+test.
    paths-ignore: [ "**.md", "docs/**", "assets/**", "LICENSE", ".gitignore" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build + test on all three platforms against the mock backend. This is the
  # gating job: it needs no hypervisor and so is fully deterministic.
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Qt is pinned per-OS: macOS needs >= 6.11 to drop the removed AGL
        # framework, but 6.11.x is not yet published for Windows via aqt, so
        # Windows/Linux stay on the 6.8 LTS. Each pairing below is CI-proven.
        include:
          - os: ubuntu-latest
            qt: '6.8.2'
          - os: macos-latest
            qt: '6.11.1'
          - os: windows-latest
            qt: '6.8.2'
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GL/EGL headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      # Ninja picks the first compiler on PATH; on the Windows runner that is
      # MinGW, which is ABI-incompatible with the MSVC-built Qt. Activate the
      # MSVC environment so cl.exe is used instead.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVMM_WITH_LIBVIRT=OFF
          -DVMM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Non-gating: make sure the real libvirt backend keeps compiling as the
  # interface evolves. Allowed to fail until phase 1 hardens it (see ROADMAP).
  libvirt-compile:
    name: libvirt backend compiles (Linux)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-dev qemu-utils libgl1-mesa-dev libegl1-mesa-dev ninja-build
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true
      - name: Configure (libvirt ON)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVMM_WITH_LIBVIRT=ON
      - name: Build
        run: cmake --build build --parallel
